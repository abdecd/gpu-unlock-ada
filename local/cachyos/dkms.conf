# Local integration only; keep separate from the upstream contribution branch.
PACKAGE_NAME="gpu-unlock-4060-local"
PACKAGE_VERSION="1.1.1.ad107.1"
BUILT_MODULE_NAME[0]="gpu_unlock"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
NO_WEAK_MODULES="yes"
BUILD_EXCLUSIVE_CONFIG="CONFIG_PCI CONFIG_FW_LOADER"
# Starting with bash avoids DKMS outer KERNELRELEASE injection.
# The helper chooses LLVM from the target kernel config, not the running kernel.
MAKE[0]="bash ./local/dkms-build.sh '${kernel_source_dir}'"
